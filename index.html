: "一、適合：\r\n1. 好奇寶寶，想一窺日文的語言特色\r\n2. 初心者玩家（但需要跟 50 音很熟）\r\n3. 懶人，只想學用得到的\r\n4. 幽默派，尋求有趣的學習方式\r\n5. 業餘玩家\r\n\r\n二、不適合：\r\n1. 跟 50 音還不太熟\r\n2. 以檢定考為本次學習目標\r\n3. 想從「禮貌體」開始學習\r\n4. 想完整學習初級日文/文法\r\n5. 傾向傳統學術式為主（沒有對錯，只是學習方式不同）", "課程簡介": "從「語言是為了溝通」為出發點！以「看圖理解」、「溝通導向」、「實際應用」為設計核心！從圖表理解架構，體會日文特色的同時，再以輕鬆貼近生活的時事例句為引導，帶入實際溝通時用得到的日文表達方式，只學習派得上用場的，挑戰開口說日文！期許以理解、實用、有趣好玩的方式切入日文語言系統，減輕負擔，增添學習樂趣。", "GID": "GaUQtzdHU_RmLZjMWDSOSw", "id": 560, "minutes": 448}, {"最新上架（上架時間）": "2024/01/02", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "全球化商務語言", "課程名稱": "難道你是韓國人？！韓語發音矯正課 ②", "課程時數": "3 時 9 分", "授課講師": "SJ eCLASS", "課程難易度": "intermediate", "適合授課對象": "1. 剛學完韓語 40 音的學習者\r\n－本門課程並非「發音課」，而是「發音矯正」，因此不會所有的母音子音一個一個教學。\r\n－能夠提前學習韓語語調，並熟悉「唸」和「說」韓文，對於要銜接初級韓語課程很有幫助。\r\n2. 想要進一步讓韓語發音更好聽的學習者\r\n－「發音」並不是學了一次就可以的，需透過反覆練習累積實力！\r\n－一般上完發音課就再也沒有機會上發音課，但想要持續練習韓語發音與口說，聽韓國人說並且跟著練習說是最好的方式。\r\n3. 韓語初中級程度學習者\r\n－課程中用全韓文的方式解說，是練習聽力的好機會。\r\n－長期養成錯誤的發音方式會變成習慣，未來想要改回正確的發音需要花更多的時間與精力，因此趁早矯正是投資報酬率最高的時機！", "課程簡介": "（本課為系列課程，此為第二堂，共六堂）用正確的發音說韓文，除了可以提升職場專業感，也能有效減少溝通誤會，加深韓國人對你的好印象。來透過大量聽力、口說練習，矯正你的韓語發音吧！", "GID": "i9vnbWqa1vuZcnquVaeviw", "id": 561, "minutes": 189}, {"最新上架（上架時間）": "2024/01/02", "課程領域（主分類）": "經營領導", "課程主題（子分類）": "領導與人才發展", "課程名稱": "有聲書｜【劉必榮孫子兵法與談判謀略的34堂課】攻心布局！拉近與成功的距離", "課程時數": "7 時 8 分", "授課講師": "一刻鯨選", "課程難易度": "intermediate", "適合授課對象": "身為公司中高階管理者的你\r\n大量應對人際關係或有商業目標的你\r\n在工作、生活中需要與他人應對的你", "課程簡介": "（一刻鯨選系列是以聲音為主的課程，建議以聆聽方式學習）攻心布局！拉近與成功的距離", "GID": "GcNtxQ3-RMDEOqC7zrljtQ", "id": 562, "minutes": 428}, {"最新上架（上架時間）": "2024/01/02", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "資訊技術與數據", "課程名稱": "利用 Tableau 創建引人入勝的資訊呈現：圖表與儀表板設計", "課程時數": "2 時 49 分", "授課講師": "陳克勤（阿克老師）", "課程難易度": "intermediate", "適合授課對象": "職務上需要設計儀表板的工作者\r\n經常接到各種圖表需求的分析師\r\n職場上需要處理數據的上班族\r\n想要精進 Tableau 功能操作、提升個人競爭力的人\r\n", "課程簡介": "建立分析圖時，最常卡在如何選擇及製作不同的圖表；本堂課程會使用 Tableau 來活用最常見的三大圖表：長條圖、折線圖、散點圖，且導入進階動作功能的動態參數、醒目提示及公式操作。最後會介紹如何學習Tableau Public上厲害的儀表板，並建立可切換圖表的進階儀表板！", "GID": "ThoAUc-ajpB846FZbvym1Q", "id": 563, "minutes": 169}, {"最新上架（上架時間）": "2024/01/02", "課程 課程時數": "3 時 36 分", "授課講師": "學思酷", "課程難易度": "beginner", "適合授課對象": "管理階層\r\n行銷企劃\r\n自媒體\r\n創業人士", "課程簡介": "品牌的市場評估往往太過樂觀，時常忽略品牌所需要的「管理」、「定位」、「消費者行為」、「銷售策略」、「美學行銷」以及「品牌定義」等等….。而這堂課將教你透析市場的銷售行為，掌握專業行銷人的基本核心能力，達成品牌行銷與經營管理的決策實力。", "GID": "mi6_FwdcGaLXAkW0abZXIQ", "id": 761, "minutes": 216}, {"最新上架（上架時間）": "2022/11/15", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "自我管理工作術", "課程名稱": "運用情境思考術，實踐當責執行力", "課程時數": "1 時 13 分", "授課講師": "Baylor", "課程難易度": "intermediate", "適合授課對象": "想運用當責執行力，帶領團隊有好表現之企業主管\r\n想持續自我精進，透過學習當責提升問題解決能力之職場工作者", "課程簡介": "透過當責，讓自己在工作中能更加提升。要能展現當責，除了理解當責內涵，更要具備當責的思考，遇到不同問題，能展現出具體當責行動。課程除介紹當責的原則與作為，更運用當責情境思考術，結合職場工作的不同情境，讓身為同仁及主管，能運用當責思維來解決問題！", "GID": "nTCPduWTYp-0EaTkhsy1ag", "id": 762, "minutes": 73}, {"最新上架（上架時間）": "2022/11/15", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "商務開發與客服", "課程名稱": "成功業務必學：30 秒讀人術", "課程時數": "26 分", "授課講師": "盧天驥", "課程難易度": "beginner", "適合授課對象": "原廠 / 代理商 / 經銷商之以下人員：\r\n業務人員\r\n行銷人員\r\nPM\r\n採購\r\n總管理處", "課程簡介": "本系列講座係分門別類說明成功的業務開發人員所需具備的各項技能。本課重點在於如何在最短的時間內明確掌握客戶的風格與個性，配套對應客戶在採購過程中所扮演的角色，進而說該說的話，做該做的事，拿該拿的訂單。", "GID": "GUnrEFfoN00sGPFCfPzBOg", "id": 763, "minutes": 26}, {"最新上架（上架時間）": "2022/11/15", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "商務開發與客服", "課程名稱": "客戶心海底針？業務必學的客戶滿意攻略", "課程時數": "1 時 23 分", "授課講師": "Andy哥", "課程難易度": "intermediate", "適合授課對象": "業務開發與市場行銷人員\r\n第一線面對客戶服務人員\r\n想具備高競爭力墊高自我身價者\r\n抓不到客戶需求而致業績起不來苦主\r\n客戶抱怨連連導致工作表現不佳者", "課程簡介": "研究發現，客戶留心率若提高5%，可使企業利潤增加 25% ~ 95%。本課程將教你客戶的互動邏輯，並搭配各項顯性專業技巧，同時透過 Andy 哥秘笈心法，傳授大量實際案例，來學習如何了解客戶，挖掘客戶潛在的真正需求與問題走向，並精準地採取正確對應的方案，最終達到「客戶絕對滿意」的雙贏！", "GID": "y206bnwojhxl0gbu5x1C1w", "id": 764, "minutes": 83}, {"最新上架（上架時間）": "2022/11/01", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "全球化商務語言", "課程名稱": "Sonny 老師的國際英文字彙力", "課程時數": "1 時 36 分", "授課講師": "Sonny Chen（陳湘陽）", "課程難易度": "intermediate", "適合授課對象": "工作上需要使用英文的同仁\r\n覺得自己英文字彙量不足的同仁\r\n覺得自己花很多時間背單字，卻事倍功半的同仁", "課程簡介": "你是否想過，有比「背單字」更有效率的學習方式？Sonny 老師的這堂課，將顛覆你對「背單字」的想像，除了提供更有效率學習單字的方式，更會親自為你講解 100 個在現代職場，一定要熟悉、活用的單字。上完這堂課，你會發現認識單字不再痛苦，學英文也變得事半功倍了！", "GID": "sY5gOSELjXmhZ22p6hTHhA", "id": 765, "minutes": 96}, {"最新上架（上架時間）": "2022/11/01", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "資訊技術與數據", "課程名稱": "軟體開發的利器：技術人要懂的 DevOps 通識課", "課程時數": "1 時 44 分", "授課講師": "柯仁傑", "課程難易度": "intermediate", "適合授課對象": "企業技術主管：想要快速知道 DevOps 是什麼，但是對於工具不熟，已經無法實際當黑手的主管\r\n工程師：想要知道 DevOps 是什麼，包含哪些面向，讓自己可以知道後續要對哪些東西繼續深入\r\n對於 DevOps 有興趣的任何人", "課程簡介": "本課程讓對 DevOps 有興趣的朋友, 可以得到以下的好處：\r\n(1) 不需要懂細部操作技術, 就能對 DevOps 有個全盤認識\r\n(2) 對於 DevOps 的導入, 曉得該怎麼進行, 哪些地方需要注意\r\n(3) 藉由案例分享, 了解優秀公司落地方式和狀況", "GID": "UtKnR4r-VmqDVByEk51-8w", "id": 766, "minutes": 104}, {"最新上架（上架時間）": "2022/11/01", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "自我管理工作術", "課程名稱": "高效職人養成攻略：從初心者到夢想家", "課程時數": "50 分", "授課講師": "張永錫", "課程難易度": "beginner", "適合授課對象": "想要建立並實現年計劃之人\r\n想要養成寫日記習慣的人\r\n覺得自己有忙碌、盲目、茫然等時間管理痛苦之人\r\n職場經歷在兩年內的社會新鮮人\r\n想更上一層樓的中階管理者", "課程簡介": "課程中引導大家完成「九宮格年計劃」，並講述每天寫日記，並教導SLOW法則，推動完成年計劃，我們會舉大谷翔平及楊勇緯等運用九宮格完成目標的案例，並教導格誌日記這個工具，幫大家順利推動自己工作及生活的年計劃。", "GID": "cezJ-HzykCt2kRjKPYuvRg", "id": 767, "minutes": 50}, {"最新上架（上架時間）": "2022/11/01", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "問題思考與解決", "課程名稱": "圖解表達力：用心智圖思維，簡化複雜問題（學習創造篇）", "課程時數": "1 時 33 分", "授課講師": "鄭冠中 Jason", "課程難易度": "beginner", "適合授課對象": "【適合的人】\r\n1. 想提升職場競爭力，需經常製作簡報、彙整資訊、報告表達的上班族\r\n2. 想要提升表達魅力被更多人看見，創造更多職涯新契機的社會新鮮人\r\n3. 想要在不同學科的教學現場，希望有方法能引導同學多元學習的老師\r\n4. 想要經營個人品牌，想提升清晰有料、魅力表達的自雇者\r\n5. 學過心智圖，想知道更多元心智圖應用的學習者\r\n6. 想要突破盲點，更有效吸收新知提升圖解溝通專業感，熱愛學習的你\r\n\r\n【不適合的人】 \r\n1. 習慣有做就好，放棄思考，不重視成果的人\r\n2. 花錢上技法類課程，卻認為用聽的就好，不願意動筆練習的人\r\n3. 不願意學習接受新知識改變，對生涯學習沒有渴望與追求的人", "課程簡介": "本課為《圖解表達力：用心智圖思維，簡化複雜問題》系列第一堂課。我們從視覺化簡報設計、口語表達、職涯規劃、學習創造等四大關鍵情境出發，透過心智圖思考法以及簡報資訊整理，幫你圖解複雜問題、提升效率，打造清晰思維，創造理想人生！\r\n", "GID": "MKMaDDyisLrNTWPU1M2eIQ", "id": 768, "minutes": 93}, {"最新上架（上架時間）": "2022/11/01", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "自我管理工作術", "課程名稱": "兩小時學會子彈筆記：訂製你的專屬生活", "課程時數": "2 時 1 分", "授課講師": "洪碁", "課程難易度": "beginner", "適合授課對象": "待辦事項多到無法負荷的人：\r\n我們經常擁有各式各樣的想法，想完成的事一樣樣新增至待辦清單，無奈時間不夠無法面面俱到。子彈筆記除了可以記錄下稍縱即逝的靈感，更能透過定期的「反思、轉移、計畫」釐清那些是真正重要的事情。\r\n\r\n經常面臨需求改變、目標調整無所適從的人：\r\n生活不在節奏上、找不到自己的目標總是令人沮喪， , "課程主題（子分類）": "溝通表達與協作", "課程名稱": "好感溝通術 - 掌握 4 步驟讓你跟誰都能聊", "課程時數": "31 分", "授課講師": "劉軒", "課程難易度": "beginner", "適合授課對象": "期許自己成為健談的人，想增進自己的社交能力\r\n面對社交場合，都不知道該說什麼\r\n想利用社交開闊視野，增廣自己的交友圈\r\n在團體中，總被說是句點王", "課程簡介": "「好的談話，從心開始。」一位跟誰都能聊得來的人，也許能講出大道理，也許有幽默口條。但聊天核心，是讓對方講出自己的故事、情緒，讓他聊得開心，自然而然就能建構一段好的對談。聊天沒有我們想像中困難，也不是與身俱來的能力，本堂課就要運用心理學理論，讓聊天技巧不再抽象，轉換為自身競爭力！\r\n\r\n", "GID": "anTcIx-KfUy-LHuxApsvQA", "id": 894, "minutes": 31}, {"最新上架（上架時間）": "2021/09/01", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "自我管理工作術", "課程名稱": "超強執行力：5 個方法打敗拖延症", "課程時數": "18 分", "授課講師": "劉軒", "課程難易度": "beginner", "適合授課對象": "認為時間永遠不夠用的工作者\r\n習慣把事情拖到最後一刻才做的人\r\n訂了許多目標,卻始終沒有實踐\r\n很想擺脫拖延症、但屢屢失敗", "課程簡介": "工作總是做不完，拖拖拉拉、累積一大堆才開始面對現實？人會拖延，並不是因為意志力不夠、效率不佳，只是還沒找到讓自己提高執行力的方法！劉軒老師總結心理學對於「拖延症」做的研究重點，帶領你找出拖延的成因，並提供即刻就能使用的解決妙方，幫助你找回丟失的時間！", "GID": "yX_eu7vUyE73w4fjCS5L8A", "id": 895, "minutes": 18}, {"最新上架（上架時間）": "2021/08/16", "課程領域（主分類）": "經營領導", "課程主題（子分類）": "經營策略與變革", "課程名稱": "徹底拆解！商業模式演化九部曲", "課程時數": "1 時 32 分", "授課講師": "歐素華", "課程難易度": "intermediate", "適合授課對象": "想要引領變革、帶領企業走上新方向的領導人\r\n發現公司產品、服務逐漸落後時代的經理人\r\n困擾於競爭力逐漸低下，需要借鏡成功實例的人", "課程簡介": "商業市場每天都以極快、高度不確定的方式變化著，當你的產品、服務、團隊，面臨到經營或發展困境時，最好的解決之道，是從根本的「商業模式」開始轉變。東吳大學企管系副教授歐素華，就整理當今得以脫穎而出的九大商業模式，輔以精采的企業案例，徹底掌握商場勝利關鍵！", "GID": "QS4vRCKG2z7yFP65A8R-4g", "id": 896, "minutes": 92}, {"最新上架（上架時間）": "2021/08/16", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "問題思考與解決", "課程名稱": "心智繪圖思考法：繪製你的思維地圖 ", "課程時數": "3 時 18 分", "授課講師": "潘國雄（Sam）", "課程難易度": "beginner", "適合授課對象": "沒有學過「心智繪圖」的初學者，想透過訓練自己的「思考方式」 帶來改變的人\r\n職場上有許多想法、知識，想要好好整理與歸納的工作者\r\n曾接觸過「心智繪圖」，但不清楚如何在生活及工作上實際應用\r\n想為自己的終身學習注入活水，帶來一點改變的人", "課程簡介": "滿腦的思緒，不知道如何整理？碰到一個複雜的問題，就容易卡、想不到該怎麼解決？這時候一張心智繪圖，可能就是最好的答案，幫助你歸納、記錄，讓大腦和想法都可以順暢運行，重新找回有條理的工作和生活。", "GID": "UBBTErGBNqCtvpGutf5A3A", "id": 897, "minutes": 198}, {"最新上架（上架時間）": "2021/08/16", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "行銷與創意設計", "課程名稱": "GTM 建置術：數位追蹤必備，代碼設定神器", "課程時數": "2 時 37 分", "授課講師": "iSPOT Media", "課程難易度": "intermediate", "適合授課對象": "想學習 GTM 但總搞不清楚邏輯與追蹤方法的初心者\r\n中階 GTM 使用者想學習進階追蹤方法與應用\r\n負責經營與維護電商平台，或身為網站行銷的工作者\r\n對廣告程式碼部署總是一頭霧水的你", "課程簡介": "準備善用數位行銷達成目標，卻因為代碼部署虛耗了許多溝通時間嗎？GTM 就是為此而生，工程師再也不用解釋技術給行銷人聽、行銷人也不用聽工程師講著代碼天書，所有代碼的修改與調整只要在 GTM 內就能完成，有效提升工作效率！", "GID": "oP3D9SEv1dbx7kd3TlkzOw", "id": 898, "minutes": 157}, {"最新上架（上架時間）": "2021/08/02", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "溝通表達與協作", "課程名稱": "職場溝通必備！商務簡報技巧", "課程時數": "1 時 6 分", "授課講師": "商業思維學院", "課程難易度": "beginner", "適合授課對象": "需要用簡報進行內部溝通的工作者\r\n需要用簡報來說明產品及銷售計畫案的銷售人員\r\n始終找不到做簡報訣竅、感到困擾的工作者", "課程簡介": "簡報是職場上最常使用的溝通管道，這堂課將會從簡報目標的擬定、簡報內容的構思、設計，到簡報的表達，最後做出一份讓聽眾 BUY-IN 的簡報，這當中各式各樣的實用技巧，從頭到尾完整、不藏私的告訴你！", "GID": "2UPxMMRFZ8xMWhpDzCbmAw", "id": 899, "minutes": 66}, {"最新上架（上架時間）": "2021/08/02", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "溝通表達與協作", "課程名稱": "管理你的會議，有效開會的 8 堂課", "課程時數": "1 時 39 分", "授課講師": "商業思維學院", "課程難易度": "beginner", "適合授課對象": "需要用簡報進行內部溝通的工作者\r\n需要用簡報來說明產品及銷售計畫案的銷售人員\r\n始終找不到做簡報訣竅、感到困擾的工作者", "課程簡介": "日常工作中避免不掉大大小小的各種會議，每次聽到要開會，你總覺得很無聊？覺得很心煩？覺得壓力超大？然而，一場好的會議，其實可以讓你展現自己！本堂課會透過 8 個單元、12 條準則，讓你懂得如何開一場有效率、品質又好、還能讓大家看見我們價值的會議！", "GID": "Sp6vXfLMostUc49wnYfGYA", "id": 900, "minutes": 99}, {"最新上架（上架時間）": "2021/07/12", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "自我管理工作術", "課程名稱": "運用 OTPR 敏捷工作法，優化你的人生選擇", "課程時數": "1 時 16 分", "授課講師": "商業思維學院", "課程難易度": "beginner", "適合授課對象": "上班總是瞎忙，時間老是不夠用的職場工作者\r\n想提升團隊現有績效的領導者\r\n渴望循序漸進完成階段性任務的人", "課程簡介": "老是有開不會完的會議、忙不完的緊急任務，回頭自己的一天，發現什麼事情都沒有完成？會有這些感受與經驗，問題就出在，我們很少仔細思考工作目標和價值，以至於無法掌握自己的時間與行程。如果想要改善這個惡性循環，那麼 OTPR 工作法就能派上用場，找回你的效率和生產力！", "GID": "AM1fWpl6amxmCcL4-NwOXw", "id": 901, "minutes": 76}, {"最新上架（上架時間）": "2021/07/12", "課程領域（主分類）": "多元生活", "課程主題（子分類）": "心理調適與韌性", "課程名稱": "學會情緒智商與壓力管理，做自己情緒的主人", "課程時數": "1 時 17 分", "授課講師": "商業思維學院", "課程難易度": "beginner", "適合授課對象": "工作壓力很大的上班族\r\n最近碰到卡關、無法調適情緒的人\r\n不懂得如何面對他人情緒的工作者", "課程簡介": "面對忙碌的生活、高壓的工作時，最難得的是什麼？能維持愉快的心境，並以充滿幹勁與活力的態度面對生活與工作，是最困難的答案之一。而這些相當懂得調節自我情緒的人，往往更容易獲得成功，而且人際關係更好，同時也能樂在工作。", "GID": "QXHuaBauh-8Ksfkg86tJxg", "id": 902, "minutes": 77}, {"最新上架（上架時間）": "2021/07/05", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "自我管理工作術", "課程名稱": "遠距工作力：溝通協作到自我管理", "課程時數": "1 時 26 分", "授課講師": "Hahow 好學校", "課程難易度": "beginner", "適合授課對象": "這堂課程沒有門檻，無論是否正在遠距居家辦公中，都歡迎加入課程，一起學習喔！", "課程簡介": "遠距上班、碰不到面溝通不順暢？在家工作好難區分上下班時間，生活節奏全都亂？四位 Hahow 名師強強聯手，就要幫助你從溝通、數位協作、時間管理，到要懂得適當休息與放鬆，找到最適合的模式，掌握遠距工作力！", "GID": "inzCMQ9kn8DQm45-JoQJ1Q", "id": 903, "minutes": 86}, {"最新上架（上架時間）": "2021/06/28", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "問題思考與解決", "課程名稱": "產品思維：像產品經理一樣思考", "課程時數": "49 分", "授課講師": "商業思維學院", "課程難易度": "beginner", "適合授課對象": "剛加入產品團隊，不知從何下手的工作者\r\n對於產品經理有興趣、想培養相關能力的人\r\n想用「產品經理思維」檢視自己職涯發展的上班族\r\n", "課程簡介": "你有沒有遇過這些情況？老闆覺得你可取代性高，不斷挑三揀四；每天都辛苦加班，但感覺整天都在救火、不知道哪些才是最重要的事情；不了解團隊或客戶的需求，最後交出的成果總是被批評。這堂課程中，就要教你如何用產品經理、産品思維的角度，解決上述這些問題，重新贏得工作與職涯的掌控權！", "GID": "jZ3WoN9fuivJO-loLzKtlQ", "id": 904, "minutes": 49}, {"最新上架（上架時間）": "2021/06/28", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "企業後勤與行政", "課程名稱": "讀懂財報的基礎入門，掌握三表意義與關係", "課程時數": "57 分", "授課講師": "商業思維學院", "課程難易度": "beginner", "適合授課對象": "任何想學習如何解讀財報，理解財務三表關係的人\r\n財報初心者：想知道公司的資產、負債，對公司營運有什麼影響\r\n晉升公司管理階層，想知道什麼才是好收入，怎麼樣評估負債與資產", "課程簡介": "老闆總說要降低成本，你知道公司的三大成本費用是什麼嗎？收入很高就代表賺錢嗎？尤其成為管理階層之後，該怎麼評估經營的效率呢？公司的本質就是為了要賺錢，而財務報表正是經營的成績單，一定要學會看懂財報，就可以從中找出蛛絲馬跡，發掘問題、改善體質！", "GID": "4OaReCZCYXD4ZazVfwh4hw", "id": 905, "minutes": 57}, {"最新上架（上架時間）": "2021/06/09", "課程領域（主分類）": "經營領導", "課程主題（子分類）": "領導與人才發展", "課程名稱": "聚焦工作重點目標，帶領團隊達成高績效", "課程時數": "29 分", "授課講師": " DDI ", "課程難易度": "beginner", "適合授課對象": "找尋如何進行績效面談方法的主管\r\n想解決績效考核無助於團隊成長的領導者\r\n不曉得怎麼訂出有效目標的工作者", "課程簡介": "說起績效面談，是工作者每年最不想面對的事情之一，但對主管而言其實也是惡夢一場：部屬沒達標、雙方無法形成共識，最終又設定了明年的無效 KPI，形同惡性循環。本堂課就要打破績效管理迷思，並以實際案例傳授正確的目標設定技巧，幫助主管和團隊一同邁向高績效！", "GID": "DJ127wCJQcTp08EWuvIfTg", "id": 906, "minutes": 29}, {"最新上架（上架時間）": "2021/05/03", "課程領域（主分類）": "經營領導", "課程主題（子分類）": "領導與人才發展", "課程名稱": "化解團隊的焦慮與抗拒，變革就能推得動！", "課程時數": "20 分", "授課講師": " DDI ", "課程難易度": "beginner", "適合授課對象": "團隊成員難以接受變化，需要協助他們改觀的主管\r\n想幫助部屬適應改變、變得更敏捷的領導人\r\n期待推動改革能由下而上、真正發揮效果的領袖", "課程簡介": "身處瞬息萬變、充斥各種波動的經濟市場中，不斷改變，是唯一不變的生存之道。但組織啟動變革時，不少團隊成員經常難以跟上，或停留原地、也不見成效結果，而此時主管的使命，就是要帶領大家擁抱改變、突破困境。本堂課提供有效的引導方法，協助團隊脫離負面情緒，並透過本堂課專屬打造的實戰演練，徹底掌握推動變革的技巧！", "GID": "SRHUbba7N4mjxHWRcPQTXA", "id": 907, "minutes": 20}, {"最新上架（上架時間）": "2021/05/03", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "資訊技術與數據", "課程名稱": "Processing - 讓程式碼說設計語言", "課程時數": "7 時 44 分", "授課講師": "Aron", "課程難易度": "beginner", "適合授課對象": "想學程式，但不知道怎麼入門的人。\r\n想學程式，但不知道學了程式可以幹嘛的人。\r\n想培養邏輯思考能力，但找不到方法的人。\r\n設計或藝術專長，希望能增加創作多元性的人。", "課程簡介": "Processing 是一套適合初學者的程式語言，它的強項在於視覺處理，可以拿來畫圖、修圖、設計海報。簡單來說，Processing 就像是程式語言版的Photoshop！除此之外，它還可以用來做動畫及互動遊戲！Processing 的語法簡單，也沒有複雜系統設定，一下就能快速上手！", "GID": "K1Mz7c2FMD7SAxm_9G3WWw", "id": 908, "minutes": 464}, {"最新上架（上架時間）": "2021/04/01", "課程領域（主分類）": "經營領導", "課程主題（子分類）": "專案治理思維", "課程名稱": "跟英特爾總監學習 OKR - 導讀版", "課程時數": "55 分", "授課講師": "王怡淳（Chris ）", "課程難易度": "beginner", "適合授課對象": "企業高層\r\n團隊主管\r\n人資培訓部門\r\n願意向上提升的職場人士", "課程簡介": "OKR 源自 Intel 的管理思考框架，但市場對 OKR 有不同解讀：OKR 是什麼？什麼是 OKR 的「道」與「術」？什麼是 OKR 心法、技法和工法？這堂課程是由曾擔任 Intel 戰略合作總監-王怡淳，將實踐輔導 OKR 的 15 年經驗結合過去工作歷練所精心提煉的 OKR 導讀課程。", "GID": "yKBD3if_FWwSa7z3y_byEg", "id": 909, "minutes": 55}, {"最新上架（上架時間）": "2021/04/01", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "商務開發與客服", "課程名稱": "顧客 Yes 學 - 深入人心的 NLP 成交力", "課程時數": "17 分", "授課講師": "常振國", "課程難易度": "beginner", "適合授課對象": "總是和客人相談甚歡，最後拿不到訂單的業務員\r\n練習過各種話術、實戰場合卻無法感受效果的業務員\r\n每次顧客提問就覺得棘手、不知道如何導回正題的銷售人員", "課程簡介": "對於業務來說，顧客口中的「Yes」可能是最動聽的字眼之一，然而對方要願意埋單，就要懂得有效且精確的銷售技巧，才能打中客戶心理痛點，而非一昧稱讚產品或堆疊無用的話術。在這堂課程中，將學會如何協助聚焦顧客需求，說出更具吸引力的言語，擠身頂尖業務員行列！", "GID": "IBYvdLgPF5e4SJ79-fMzvw", "id": 910, "minutes": 17}, {"最新上架（上架時間）": "2021/03/24", "課程領域（主分類）": "經營領導", "課程主題（子分類）": "領導與人才發展", "課程名稱": "會帶人的主管都懂：一次到位的精準回饋技巧", "課程時數": "17 分", "授課講師": " DDI ", "課程難易度": "beginner", "適合授課對象": "困擾於部屬總是聽不進建議的主管\r\n希望自己給的回饋，都能被落實的領袖\r\n想要幫助團隊走得更好、更遠的領導者\r\n準備接下管理職，期待能發揮影響力的工作者", "課程簡介": "管理現場最常見的難題，是無法和團隊順暢溝通，尤其當部屬「有聽沒有懂」「懂了卻不做」時，事後就得花上很多時間和心力補救。然而溝通效果不彰，可能是主管使用了錯誤的方式，本堂課便提供可輕鬆上手的回饋原則，讓每位領導者能在正確時機、給予「聽得進去」的建議，幫助正面行為持續發酵、負面行為有效改善。", "GID": "EnX5jRgWzkKxvPaNI2eDGA", "id": 911, "minutes": 17}, {"最新上架（上架時間）": "2021/03/02", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "全球化商務語言", "課程名稱": "職場英文大補帖｜必勝簡報方程式", "課程時數": "2 時 6 分", "授課講師": "CLN (Corporate Language Network)", "課程難易度": "intermediate", "適合授課對象": "工作中常需要以英語向客戶、主管發表簡報、提案的商業人士\r\n做英文簡報時常沒有辦法好好組織架構、表達想法的專業人士\r\n欲培養職場軟實力，掌握英文簡報表達與溝通能力的職場人\r\n", "課程簡介": "擁有 Google、IBM、台積電企業培訓經驗的 Clarence 老師發現，英文簡報讓職場人頭疼的地方不外乎不清楚英文簡報架構、不知如何流暢表達、不熟悉簡報專業句型。這堂課由有 20 年英文簡報教學功力 Clarence 講授，讓你用一堂課時間完整掌握英文簡報精髓，從成功的簡報開始擴大職場影響力！", "GID": "o58Xgr2MwK9sip1BoNG1GA", "id": 912, "minutes": 126}, {"最新上架（上架時間）": "2021/02/01", "課程領域（主分類）": "核心職能", "課程主題（子分類）": "溝通表達與協作", "課程名稱": "掌握 Boss 心思 - 主管溝通突圍術", "課程時數": "43 分", "授課講師": "歐耶", "課程難易度": "beginner", "適合授課對象": "正在煩惱如何跟自己的上司、客戶、部屬溝通的職場人\r\n不希望在對上對下溝通互動時，同樣的衝突重複再發生\r\n想成為能快速因人而異、因溝通情境調整改變的協調者\r\n願覺察自我與他人的管理風格，學習如何化解衝突的人\r\n想辨識自己與對方的內在想法，並改善彼此的溝通模式\r\n", "課程簡介": "你遇過處不來的 Boss 嗎？破解主管的內心劇場不必靠胡亂猜心，透過系統化地分析主管的管理風格，就能找出合適的回應方式、掌握有效溝通模式。這堂課精選「TA 交流分析系統」中的兩項應用—心理地位四象限、真假問題分辨圖，帶你實際應用於常見的溝通情境範例中。", "GID": "XRMvjTqWX0vtcBBWK4vRQQ", "id": 913, "minutes": 43}, {"最新上架（上架時間）": "2020/12/15", "課程領域（主分類）": "多元生活", "課程主題（子分類）": "人文藝術品味", "課程名稱": "抓住人物的靈魂｜自由筆觸繪出你我他", "課程時數": "1 時 29 分", "授課講師": "黃湘", "課程難易度": "beginner", "適合授課對象": "想學習複合式媒材繪圖的人\r\n喜歡五官、肢體、繪畫的人\r\n想勾勒出自由、柔軟線條的人\r\n想幫身邊的親朋好友畫似顏繪的人\r\n", "課程簡介": "圖畫久了，總是有點被過多的技巧或繪圖概念侷限。讓我們重新專注於眼前的人物，用線條抓出對方的五官、表情、肢體，搭配簡單的複合媒材，勾勒出每個遇見的人物靈魂。", "GID": "FZ_nBA4M9WATkch4wp3tow", "id": 914, "minutes": 89}, {"最新上架（上架時間）": "2020/12/15", "課程領域（主分類）": "多元生活", "課程主題（子分類）": "人文藝術品味", "課程名稱": "超簡單羊毛氈｜捲毛好朋友入門班", "課程時數": "1 時 13 分", "授課講師": "河馬媽", "課程難易度": "beginner", "適合授課對象": "喜歡藉由手作療癒身心，或想要自己動手創作可愛小物的人", "課程簡介": "在這堂羊毛氈的入門課中，老師會循序漸進地帶著大家，從最簡單的幾何塑形開始，並以自創的版型小工具，讓學生更輕鬆就能掌握形狀，在極少的挫折和成本之下，可以深入探索羊毛氈這個療癒手作藝術的世界。\r\n", "GID": "nigQHHDFsOZDXr2MoKcOrg", "id": 915, "minutes": 73}, {"最新上架（上架時間）": "2020/12/15", "課程領域（主分類）": "多元生活", "課程主題（子分類）": "人文藝術品味", "課程名稱": "爵士吉他入門訓練班", "課程時數": "5 時 1 分", "授課講師": "吳為民(叮咚)", "課程難易度": "intermediate", "適合授課對象": "已經有一定樂理和演奏能力，想要更進一步深化能力的人\r\n希望能踏進爵士樂領域的人\r\n", "課程簡介": "如果你想讓演奏更有深度，學習爵士吉他絕對能幫助你往前跨越一大步。本堂課程會教導如何入門爵士吉他演奏，學習爵士樂的伴奏手法、分析曲子、音階及和弦 求！", "GID": "9i-22fx8ERIlwZBCo7NZOg", "id": 973, "minutes": 224}, {"最新上架（上架時間）": "2020/08/12", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "行銷與創意設計", "課程名稱": "影音行銷｜將名單變成訂單的最佳解答", "課程時數": "1 時 21 分", "授課講師": "Ann Zuo", "課程難易度": "beginner", "適合授課對象": "如果把行銷專業度分成四年級的話，一到三年級的行銷人皆適合這堂課；還有小型企業主。\r\n\r\n一年級的行銷新生、行銷助理。協助收集市場資訊、輔助行銷活動者。你了解青春有限、時間很寶貴，學會關鍵技能才能當跳級生，必聽！\r\n\r\n二年級的行銷專員、小編。可能擅長某項行銷技術操作，但對整體的行銷觀念破碎。\r\n學會以行銷漏斗的觀念注入影音策略，可讓你內力外功都倍增，必聽！\r\n\r\n三年級的行銷中階主管。負責行銷計畫預算編列、策略制定與MROI。聰明的行銷中階主管，了解市場與使用者習性不斷演化，行銷技術也要時時跟進才能維持競爭力，必聽！\r\n\r\n四年級的行銷高階主管。掌握市場情報、為行銷策略與目標達成率的成敗負責。建議您把時間花在思考下一步棋怎麼走，歡迎您訂閱快創影音行銷專欄，掌握行銷市場趨勢。\r\n\r\n校長兼撞鐘的小型企業主。想瞭解如何以非常經濟的成本和有效的方法，就能制定出可執行的影音策略來驅動業務成長。公司行銷策略與執行都親力親為的你，必聽！\r\n", "課程簡介": "利用殺手級的影音內容矩陣秘技，規劃出一個策略型的影音計劃，提升行銷漏斗中的轉換率，將名單轉換成訂單。", "GID": "afK19agUrMtVAshXWo8e3w", "id": 974, "minutes": 81}, {"最新上架（上架時間）": "2020/08/12", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "行銷與創意設計", "課程名稱": "從 iPad 入門 - 音樂製作 & 影像剪輯", "課程時數": "4 時 44 分", "授課講師": "徐歡 CheerHsu", "課程難易度": "beginner", "適合授課對象": "因為科技進步的力量，使我們的生活方式大大改變。\r\n1. 本身熱愛音樂，但從沒機會學習過。\r\n2. 會至少一樣樂器，但不會音樂製作，想學錄音和編曲。\r\n3. 本身有一定的音樂基礎也會數位音樂，但想體驗不一樣的製作方式。\r\n4. 對於使用一般影像軟體覺得太艱深，想用簡單的方式學習剪輯影片。\r\n\r\n如果你是屬於以上四種的同學，請不要猶豫一起踏出這一步吧！！！", "課程簡介": "在這充滿著微電影、音樂MV、短片行銷的新媒體時代，掌握音樂和影像的技術是很重要的，這堂課程帶您用一台 iPad 學習音樂製作和影像剪輯。", "GID": "VcUkuhnNf2dOQCMqFneUAA", "id": 975, "minutes": 284}, {"最新上架（上架時間）": "2020/08/11", "課程領域（主分類）": "多元生活", "課程主題（子分類）": "身體健康與運動", "課程名稱": "你的明星教練－祖雄的腹肌養成計畫", "課程時數": "2 時 0 分", "授課講師": "星浪娛樂", "課程難易度": "beginner", "適合授課對象": "○ 久坐辦公室的上班族\r\n○ 積極健身卻苦無成效的健身苦手\r\n○ 三餐老是在外卻又想重視健康的外食族\r\n只要是想讓自己體態變好的人，都可以來參加！", "課程簡介": "腹肌訓練課程，跟著祖雄從運動健身和飲食攝取兩大面向，帶你朝理想體態邁進。課程包含核心運動訓練菜單、健康飲食觀念和基礎營養學，還會教你如何自製健康餐、減脂餐，以及腹肌訓練最重要的健腹心肺運動組合，扎實腹肌健身訓練，你也能擁有好體態。", "GID": "OXyiHd_ska9g1Pm-O0e7kA", "id": 976, "minutes": 120}, {"最新上架（上架時間）": "2020/08/11", "課程領域（主分類）": "專業職能", "課程主題（子分類）": "行銷與創意設計", "課程名稱": "從零開始學文案 — 育名的文案小教室", "課程時數": "4 時 40 分", "授課講師": "min043046", "課程難易度": "beginner", "適合授課對象": "零基礎的初心者\r\n投身文案工作卻不知從何開始的社會新鮮人\r\n工作上經常需要撰寫文案的人，如：行銷企劃、文字工 'use strict';
const CONFIG={formsUrl:'https://forms.cloud.microsoft/r/37M3zANUJD'};
const DATA=JSON.parse(document.getElementById('catalog-data').textContent);
const H={date:'最新上架（上架時間）',category:'課程領域（主分類）',topic:'課程主題（子分類）',title:'課程名稱',duration:'課程時數',teacher:'授課講師',level:'課程難易度',audience:'適合授課對象',description:'課程簡介'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const levelLabel=s=>({beginner:'初階',intermediate:'中階',advanced:'進階',all:'不限程度'}[s]||s||'未提供');
const norm=s=>String(s).normalize('NFKC').toLowerCase();
const searchable=new Map(DATA.map(d=>[d.id,norm(Object.values(H).map(k=>d[k]).join(' '))]));
const synonyms=[['ai','人工智慧','人工智能'],['管理','領導'],['溝通','表達'],['創新','創意'],['數位','數字化'],['健康','身心']];

let page=1,filtered=[],lastFocus=null;const SIZE=12;
function options(id,key,all,source=DATA){const current=$(id).value;$(id).innerHTML='<option value="">'+all+'</option>'+[...new Set(source.map(d=>d[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(v=>'<option value="'+esc(v)+'">'+esc(key===H.level?levelLabel(v):v)+'</option>').join('');if([...$(id).options].some(o=>o.value===current))$(id).value=current;}
options('category',H.category,'全部領域');options('topic',H.topic,'全部主題');options('level',H.level,'全部程度');
function terms(){return norm($('query').value).trim().split(/\s+/).filter(Boolean).map(t=>synonyms.find(g=>g.includes(t))||[t]);}
function score(d,groups){return groups.reduce((s,g)=>s+(g.some(t=>norm(d[H.title]).includes(t))?5:1),0);}
function refresh(){const g=terms();filtered=DATA.filter(d=>(!$('category').value||d[H.category]===$('category').value)&&(!$('topic').value||d[H.topic]===$('topic').value)&&(!$('level').value||d[H.level]===$('level').value)&&g.every(group=>group.some(t=>searchable.get(d.id).includes(t))));filtered.sort((a,b)=>{switch($('sort').value){case 'title':return a[H.title].localeCompare(b[H.title],'zh-Hant');case 'short':return a.minutes-b.minutes;case 'long':return b.minutes-a.minutes;case 'relevance':if(g.length)return score(b,g)-score(a,g);default:return b[H.date].localeCompare(a[H.date]);}});page=1;render();}
function render(){const total=Math.max(1,Math.ceil(filtered.length/SIZE));page=Math.min(page,total);$('count').textContent='共 '+filtered.length.toLocaleString()+' 門課程 ／ 全部 '+DATA.length.toLocaleString()+' 門';$('cards').innerHTML=filtered.slice((page-1)*SIZE,page*SIZE).map(d=>'<article class="card"><div><span class="tag">'+esc(d[H.category])+' · '+esc(d[H.topic])+'</span></div><h3>'+esc(d[H.title])+'</h3><p class="desc">'+esc(d[H.description])+'</p><div class="meta"><span>◷ '+esc(d[H.duration])+'</span><span>'+esc(levelLabel(d[H.level]))+'</span><span>'+esc(d[H.teacher])+'</span></div><div class="cardfoot"><small>上架 '+esc(d[H.date])+'</small><button class="detail" data-id="'+d.id+'" aria-label="'+esc('查看課程：'+d[H.title])+'">查看課程 →</button></div></article>').join('');if(!filtered.length){$('cards').innerHTML='<div class="empty"><h3>還沒找到符合的課程</h3><p>試試較短的關鍵字，或清除篩選條件。<br>也可以從以下領域重新探索：</p>'+[...new Set(DATA.map(d=>d[H.category]).filter(Boolean))].slice(0,5).map(c=>'<button class="suggest" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';}$('page').textContent=page+' / '+total+' 頁';$('prev').disabled=page===1;$('next').disabled=page>=total;}
function details(id){const d=DATA.find(d=>d.id===Number(id));if(!d)return;lastFocus=document.activeElement;$('dialogbody').innerHTML='<h2 id="dialogtitle">'+esc(d[H.title])+'</h2>'+Object.values(H).filter(k=>k!==H.title).map(k=>'<h3>'+esc(k)+'</h3><div class="full">'+esc(d[k]||'未提供')+'</div>').join('');$('dialog').showModal();}
function reset(){for(const id of ['query','category','topic','level'])$(id).value='';$('sort').value='latest';options('topic',H.topic,'全部主題');refresh();}
$('latest').innerHTML=latest.slice(0,15).map(d=>'<button class="latest" data-id="'+d.id+'"><time>'+esc(d[H.date])+'</time><span>'+esc(d[H.title])+'</span></button>').join('');
$('query').addEventListener('input',()=>{if($('query').value.trim())$('sort').value='relevance';refresh();});$('category').addEventListener('change',()=>{options('topic',H.topic,'全部主題',DATA.filter(d=>!$('category').value||d[H.category]===$('category').value));refresh();});for(const id of ['topic','level','sort'])$(id).addEventListener('change',refresh);$('reset').addEventListener('click',reset);
document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)details(b.dataset.id);const c=e.target.closest('[data-category]');if(c){reset();$('category').value=c.dataset.category;options('topic',H.topic,'全部主題',DATA.filter(d=>d[H.category]===c.dataset.category));refresh();}});
$('prev').addEventListener('click',()=>{page--;render();$('count').scrollIntoView({block:'start'});});$('next').addEventListener('click',()=>{page++;render();$('count').scrollIntoView({block:'start'});});document.querySelector('.close').addEventListener('click',()=>$('dialog').close());$('dialog').addEventListener('close',()=>lastFocus?.focus());$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close();}});refresh();
